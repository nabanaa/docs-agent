version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: fastapi run app/main.py --port 8000

  frontend:
    build: 
      context: .
      dockerfile: ui/Dockerfile 
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/v1/chat
    depends_on:
      - backend