version: '3.8'

services:
  backend:
    build: .
    volumes:
      - ./db:/app/db  
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: fastapi run app/main.py --port 8000
    restart: always

  frontend:
    build: 
      context: .
      dockerfile: ui/Dockerfile 
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend